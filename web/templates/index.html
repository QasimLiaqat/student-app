<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Student Portal | Data Entry</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        min-height: 100vh;
        background: linear-gradient(135deg, #0f172a, #1e3a8a, #4f46e5);
        color: #1e293b;
        padding: 30px 20px;
    }

    .container {
        max-width: 900px;
        margin: auto;
    }

    .header {
        color: white;
        text-align: center;
        margin-bottom: 30px;
    }

    .header .logo {
        width: 70px;
        height: 70px;
        margin: 0 auto 15px;
        border-radius: 20px;
        background: rgba(255,255,255,0.15);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        backdrop-filter: blur(10px);
    }

    .header h1 {
        font-size: 32px;
        margin-bottom: 8px;
    }

    .header p {
        color: #cbd5e1;
        font-size: 15px;
    }

    .card {
        background: rgba(255,255,255,0.97);
        border-radius: 20px;
        padding: 35px;
        box-shadow: 0 25px 60px rgba(0,0,0,0.25);
    }

    .card-header {
        margin-bottom: 28px;
    }

    .card-header h2 {
        font-size: 24px;
        color: #0f172a;
        margin-bottom: 6px;
    }

    .card-header p {
        color: #64748b;
        font-size: 14px;
    }

    .form-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
    }

    .form-group.full {
        grid-column: span 2;
    }

    label {
        font-size: 14px;
        font-weight: 600;
        color: #334155;
        margin-bottom: 8px;
    }

    input {
        width: 100%;
        padding: 13px 15px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        font-size: 15px;
        outline: none;
        transition: 0.2s;
        background: #f8fafc;
    }

    input:focus {
        border-color: #4f46e5;
        background: white;
        box-shadow: 0 0 0 3px rgba(79,70,229,0.12);
    }

    .submit-btn {
        width: 100%;
        border: none;
        padding: 14px;
        margin-top: 25px;
        border-radius: 10px;
        background: linear-gradient(135deg, #4f46e5, #2563eb);
        color: white;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s;
    }

    .submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(37,99,235,0.3);
    }

    .results-link {
        display: block;
        text-align: center;
        margin-top: 22px;
        color: #4f46e5;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
    }

    .results-link:hover {
        text-decoration: underline;
    }

    .footer {
        text-align: center;
        color: #cbd5e1;
        font-size: 13px;
        margin-top: 25px;
    }

    @media (max-width: 650px) {
        body {
            padding: 20px 12px;
        }

        .card {
            padding: 25px 20px;
        }

        .form-grid {
            grid-template-columns: 1fr;
        }

        .form-group.full {
            grid-column: span 1;
        }

        .header h1 {
            font-size: 25px;
        }
    }
</style>

</head> <body> <div class="container">
<div class="header">
    <div class="logo">🎓</div>
    <h1>Student Management Portal</h1>
    <p>Manage student information quickly and securely</p>
</div>

<div class="card">

    <div class="card-header">
        <h2>Student Registration</h2>
        <p>Enter the student's information below.</p>
    </div>

    <form method="POST">

        <div class="form-grid">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter full name"
                    required>
            </div>

            <div class="form-group">
                <label for="roll">Roll Number</label>
                <input
                    type="text"
                    id="roll"
                    name="roll"
                    placeholder="e.g. CS-001"
                    required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input
                    type="text"
                    id="phone"
                    name="phone"
                    placeholder="Enter phone number"
                    required>
            </div>

            <div class="form-group">
                <label for="cgpa">CGPA</label>
                <input
                    type="text"
                    id="cgpa"
                    name="cgpa"
                    placeholder="e.g. 3.75"
                    required>
            </div>

            <div class="form-group full">
                <label for="degree">Degree Program</label>
                <input
                    type="text"
                    id="degree"
                    name="degree"
                    placeholder="e.g. BS Computer Science"
                    required>
            </div>

        </div>

        <button type="submit" class="submit-btn">
            Submit Student Data
        </button>

    </form>

    <a href="/results" class="results-link">
        View Student Results →
    </a>

</div>

<div class="footer">
    Student Management System • 2026
</div>

</div> </body> </html>
